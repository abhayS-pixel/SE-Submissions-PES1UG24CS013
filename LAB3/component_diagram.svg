<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 2400" width="2800" height="2400" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <g id="uml-comp-icon">
      <rect x="0" y="0" width="38" height="30" fill="#FFFFFF" stroke="#4A5568" stroke-width="2.5" rx="2"/>
      <rect x="-7" y="5" width="14" height="7" fill="#FFFFFF" stroke="#4A5568" stroke-width="2"/>
      <rect x="-7" y="18" width="14" height="7" fill="#FFFFFF" stroke="#4A5568" stroke-width="2"/>
    </g>
  </defs>

  <!-- Title Banner -->
  <rect x="70" y="40" width="2660" height="150" rx="14" fill="#1A365D" filter="url(#shadow)"/>
  <text x="1400" y="98" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="bold">UML 2.0 Component Diagram: Self-Service Coffee Kiosk System</text>
  <text x="1400" y="145" text-anchor="middle" fill="#E2E8F0" font-size="24">Architectural Pattern: Three-Tier Layered Architecture (Presentation, Business, Data Layers)</text>

  <!-- Presentation Layer -->
  <rect x="70" y="220" width="2660" height="360" rx="14" fill="#F8FAFC" stroke="#CBD5E0" stroke-width="3"/>
  <rect x="70" y="220" width="380" height="48" rx="10" fill="#2B6CB0"/>
  <text x="260" y="252" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="bold">&lt;&lt;layer&gt;&gt; Presentation Layer</text>

  <!-- UI Component -->
  <g transform="translate(800, 295)" filter="url(#shadow)">
    <rect x="0" y="0" width="1200" height="215" rx="12" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="3"/>
    <rect x="0" y="0" width="1200" height="54" rx="12" fill="#EBF8FF"/>
    <line x1="0" y1="54" x2="1200" y2="54" stroke="#2B6CB0" stroke-width="2"/>
    <use href="#uml-comp-icon" x="1145" y="12" stroke="#2B6CB0"/>
    <text x="600" y="34" text-anchor="middle" fill="#2B6CB0" font-size="20" font-weight="bold">&lt;&lt;component&gt;&gt;</text>
    <text x="600" y="96" text-anchor="middle" fill="#1A202C" font-size="30" font-weight="bold">User Interface Component</text>
    <text x="600" y="128" text-anchor="middle" fill="#4A5568" font-size="21">Touchscreen Display &amp; Customer Interaction Workflow UI</text>
    
    <rect x="20" y="150" width="365" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="202" y="176" text-anchor="middle" fill="#4A5568" font-size="17">Coffee Selection (Espresso, Americano, Latte)</text>
    <rect x="417" y="150" width="365" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="600" y="176" text-anchor="middle" fill="#4A5568" font-size="17">Drink Size Selector (Small, Large)</text>
    <rect x="815" y="150" width="365" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="997" y="176" text-anchor="middle" fill="#4A5568" font-size="17">Payment Prompt &amp; Order Review</text>
  </g>

  <!-- Interface 1: IOrderProcessing -->
  <line x1="1400" y1="510" x2="1400" y2="618" stroke="#2B6CB0" stroke-width="4"/>
  <path d="M 1378 618 A 22 22 0 0 0 1422 618" fill="none" stroke="#2B6CB0" stroke-width="4"/>
  <circle cx="1400" cy="630" r="14" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="4"/>
  <line x1="1400" y1="644" x2="1400" y2="750" stroke="#2B6CB0" stroke-width="4"/>

  <g transform="translate(1440, 592)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="2"/>
    <text x="18" y="27" fill="#2B6CB0" font-size="20" font-weight="bold">IOrderProcessing &lt;&lt;interface&gt;&gt;</text>
    <text x="18" y="52" fill="#4A5568" font-size="17">API: submitOrder(items), cancelOrder(), getMenu()</text>
    <text x="18" y="72" fill="#718096" font-size="15">Protocol: Direct In-Process API / Event Bus Call</text>
  </g>

  <!-- Business Layer -->
  <rect x="70" y="700" width="2660" height="890" rx="14" fill="#F8FAFC" stroke="#CBD5E0" stroke-width="3"/>
  <rect x="70" y="700" width="380" height="48" rx="10" fill="#D69E2E"/>
  <text x="260" y="732" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="bold">&lt;&lt;layer&gt;&gt; Business Layer</text>

  <!-- Order Manager Component -->
  <g transform="translate(800, 750)" filter="url(#shadow)">
    <rect x="0" y="0" width="1200" height="215" rx="12" fill="#FFFFFF" stroke="#D69E2E" stroke-width="3"/>
    <rect x="0" y="0" width="1200" height="54" rx="12" fill="#FEFCBF"/>
    <line x1="0" y1="54" x2="1200" y2="54" stroke="#D69E2E" stroke-width="2"/>
    <use href="#uml-comp-icon" x="1145" y="12" stroke="#D69E2E"/>
    <text x="600" y="34" text-anchor="middle" fill="#B7791F" font-size="20" font-weight="bold">&lt;&lt;component&gt;&gt;</text>
    <text x="600" y="96" text-anchor="middle" fill="#1A202C" font-size="30" font-weight="bold">Order Manager Component</text>
    <text x="600" y="128" text-anchor="middle" fill="#4A5568" font-size="21">Central Coordinator, Order State Machine &amp; Business Workflow Orchestrator</text>
    
    <rect x="20" y="150" width="365" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="202" y="176" text-anchor="middle" fill="#4A5568" font-size="17">Order Lifecycle State Machine</text>
    <rect x="417" y="150" width="365" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="600" y="176" text-anchor="middle" fill="#4A5568" font-size="17">Item &amp; Tax Pricing Engine</text>
    <rect x="815" y="150" width="365" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="997" y="176" text-anchor="middle" fill="#4A5568" font-size="17">Hardware / Peripheral Coordinator</text>
  </g>

  <!-- Payment Service Component -->
  <g transform="translate(110, 1280)" filter="url(#shadow)">
    <rect x="0" y="0" width="720" height="215" rx="12" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/>
    <rect x="0" y="0" width="720" height="54" rx="12" fill="#FAF5FF"/>
    <line x1="0" y1="54" x2="720" y2="54" stroke="#805AD5" stroke-width="2"/>
    <use href="#uml-comp-icon" x="665" y="12" stroke="#805AD5"/>
    <text x="360" y="34" text-anchor="middle" fill="#6B46C1" font-size="20" font-weight="bold">&lt;&lt;component&gt;&gt;</text>
    <text x="360" y="96" text-anchor="middle" fill="#1A202C" font-size="30" font-weight="bold">Payment Service Component</text>
    <text x="360" y="128" text-anchor="middle" fill="#4A5568" font-size="21">Encapsulated Credit Card Processing &amp; POS Terminal Driver</text>
    
    <rect x="20" y="150" width="325" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="182" y="176" text-anchor="middle" fill="#4A5568" font-size="16">EMV / NFC POS Terminal Driver</text>
    <rect x="375" y="150" width="325" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="537" y="176" text-anchor="middle" fill="#4A5568" font-size="16">PCI-DSS Tokenization &amp; Auth</text>
  </g>

  <!-- Receipt Printer Component -->
  <g transform="translate(1970, 1280)" filter="url(#shadow)">
    <rect x="0" y="0" width="720" height="215" rx="12" fill="#FFFFFF" stroke="#DD6B20" stroke-width="3"/>
    <rect x="0" y="0" width="720" height="54" rx="12" fill="#FFFAF0"/>
    <line x1="0" y1="54" x2="720" y2="54" stroke="#DD6B20" stroke-width="2"/>
    <use href="#uml-comp-icon" x="665" y="12" stroke="#DD6B20"/>
    <text x="360" y="34" text-anchor="middle" fill="#C05621" font-size="20" font-weight="bold">&lt;&lt;component&gt;&gt;</text>
    <text x="360" y="96" text-anchor="middle" fill="#1A202C" font-size="30" font-weight="bold">Receipt Printer Component</text>
    <text x="360" y="128" text-anchor="middle" fill="#4A5568" font-size="21">Thermal Printer Hardware Controller &amp; Receipt Formatter</text>
    
    <rect x="20" y="150" width="325" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="182" y="176" text-anchor="middle" fill="#4A5568" font-size="16">ESC/POS Layout &amp; Print Engine</text>
    <rect x="375" y="150" width="325" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="537" y="176" text-anchor="middle" fill="#4A5568" font-size="16">Paper Sensor &amp; Telemetry</text>
  </g>

  <!-- Connectors in Business Layer -->
  <!-- IPaymentService Connector -->
  <path d="M 980 965 L 980 1060 L 562 1060" fill="none" stroke="#805AD5" stroke-width="4"/>
  <path d="M 562 1040 A 20 20 0 0 1 562 1080" fill="none" stroke="#805AD5" stroke-width="4"/>
  <circle cx="549" cy="1060" r="13" fill="#FFFFFF" stroke="#805AD5" stroke-width="4"/>
  <path d="M 536 1060 L 470 1060 L 470 1280" fill="none" stroke="#805AD5" stroke-width="4"/>

  <g transform="translate(160, 1125)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="2"/>
    <text x="18" y="27" fill="#805AD5" font-size="20" font-weight="bold">IPaymentService &lt;&lt;interface&gt;&gt;</text>
    <text x="18" y="52" fill="#4A5568" font-size="17">API: authorizePayment(orderId, amount)</text>
    <text x="18" y="72" fill="#718096" font-size="15">Protocol: Synchronous Local IPC / POS Terminal</text>
  </g>

  <!-- IReceiptPrinter Connector -->
  <path d="M 1820 965 L 1820 1060 L 2238 1060" fill="none" stroke="#DD6B20" stroke-width="4"/>
  <path d="M 2238 1040 A 20 20 0 0 0 2238 1080" fill="none" stroke="#DD6B20" stroke-width="4"/>
  <circle cx="2251" cy="1060" r="13" fill="#FFFFFF" stroke="#DD6B20" stroke-width="4"/>
  <path d="M 2264 1060 L 2330 1060 L 2330 1280" fill="none" stroke="#DD6B20" stroke-width="4"/>

  <g transform="translate(2170, 1125)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="2"/>
    <text x="18" y="27" fill="#DD6B20" font-size="20" font-weight="bold">IReceiptPrinter &lt;&lt;interface&gt;&gt;</text>
    <text x="18" y="52" fill="#4A5568" font-size="17">API: printReceipt(orderData), checkStatus()</text>
    <text x="18" y="72" fill="#718096" font-size="15">Protocol: ESC/POS Command Stream over USB/Serial</text>
  </g>

  <!-- Data Layer -->
  <rect x="70" y="1680" width="2660" height="660" rx="14" fill="#F8FAFC" stroke="#CBD5E0" stroke-width="3"/>
  <rect x="70" y="1680" width="380" height="48" rx="10" fill="#38A169"/>
  <text x="260" y="1712" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="bold">&lt;&lt;layer&gt;&gt; Data Layer</text>

  <!-- Database Component -->
  <g transform="translate(800, 1790)" filter="url(#shadow)">
    <rect x="0" y="0" width="1200" height="230" rx="12" fill="#FFFFFF" stroke="#38A169" stroke-width="3"/>
    <rect x="0" y="0" width="1200" height="54" rx="12" fill="#F0FFF4"/>
    <line x1="0" y1="54" x2="1200" y2="54" stroke="#38A169" stroke-width="2"/>
    <use href="#uml-comp-icon" x="1145" y="12" stroke="#38A169"/>
    <text x="600" y="34" text-anchor="middle" fill="#2F855A" font-size="20" font-weight="bold">&lt;&lt;component&gt;&gt;</text>
    <text x="600" y="96" text-anchor="middle" fill="#1A202C" font-size="30" font-weight="bold">Database Component</text>
    <text x="600" y="128" text-anchor="middle" fill="#4A5568" font-size="21">Embedded Relational Data Store (Menu Catalog, Dynamic Pricing &amp; Auditing)</text>
    
    <rect x="20" y="150" width="365" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="202" y="176" text-anchor="middle" fill="#4A5568" font-size="17">Menu Catalog (Espresso, Americano, Latte)</text>
    <rect x="417" y="150" width="365" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="600" y="176" text-anchor="middle" fill="#4A5568" font-size="17">Drink Pricing Matrix (Small, Large)</text>
    <rect x="815" y="150" width="365" height="40" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
    <text x="997" y="176" text-anchor="middle" fill="#4A5568" font-size="17">Order Transaction Audit Log</text>
  </g>

  <!-- IDataAccess Connector -->
  <line x1="1400" y1="965" x2="1400" y2="1368" stroke="#38A169" stroke-width="4"/>
  <path d="M 1378 1368 A 22 22 0 0 0 1422 1368" fill="none" stroke="#38A169" stroke-width="4"/>
  <circle cx="1400" cy="1380" r="14" fill="#FFFFFF" stroke="#38A169" stroke-width="4"/>
  <line x1="1400" y1="1394" x2="1400" y2="1790" stroke="#38A169" stroke-width="4"/>

  <g transform="translate(1440, 1340)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="2"/>
    <text x="18" y="27" fill="#38A169" font-size="20" font-weight="bold">IDataAccess &lt;&lt;interface&gt;&gt;</text>
    <text x="18" y="52" fill="#4A5568" font-size="17">API: getMenuCatalog(), getItemPrice(), saveOrderRecord()</text>
    <text x="18" y="72" fill="#718096" font-size="15">Protocol: Embedded SQL / SQLite API / DAO Queries</text>
  </g>

  <!-- Legend -->
  <g transform="translate(120, 1750)" filter="url(#shadow)">
    <rect x="0" y="0" width="640" height="420" rx="12" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="2"/>
    <text x="28" y="38" fill="#1A202C" font-size="24" font-weight="bold">UML 2.0 Notation Legend</text>
    <use href="#uml-comp-icon" x="28" y="65" stroke="#2B6CB0"/>
    <text x="90" y="86" fill="#4A5568" font-size="19">&lt;&lt;component&gt;&gt; Executable System Module</text>
    
    <circle cx="50" cy="140" r="15" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="3"/>
    <line x1="15" y1="140" x2="35" y2="140" stroke="#2B6CB0" stroke-width="3"/>
    <text x="90" y="146" fill="#4A5568" font-size="19">Provided Interface (Ball / Offers Service)</text>

    <path d="M 30 175 A 20 20 0 0 0 30 215" fill="none" stroke="#2B6CB0" stroke-width="3"/>
    <line x1="50" y1="195" x2="75" y2="195" stroke="#2B6CB0" stroke-width="3"/>
    <text x="90" y="201" fill="#4A5568" font-size="19">Required Interface (Socket / Needs Service)</text>

    <circle cx="45" cy="249" r="14" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="3"/>
    <path d="M 38 229 A 20 20 0 0 0 38 269" fill="none" stroke="#2B6CB0" stroke-width="3"/>
    <line x1="12" y1="249" x2="31" y2="249" stroke="#2B6CB0" stroke-width="3"/>
    <line x1="59" y1="249" x2="78" y2="249" stroke="#2B6CB0" stroke-width="3"/>
    <text x="90" y="255" fill="#4A5568" font-size="19">Assembly Connector (Ball &amp; Socket Joint)</text>

    <line x1="15" y1="305" x2="75" y2="305" stroke="#718096" stroke-width="3"/>
    <text x="90" y="311" fill="#4A5568" font-size="19">Architectural Layer Boundary</text>

    <text x="28" y="365" fill="#2B6CB0" font-size="22" font-weight="bold">Architecture Style: Layered Architecture</text>
    <text x="28" y="395" fill="#718096" font-size="16">Strict Dependency Flow: Presentation -&gt; Business -&gt; Data</text>
  </g>

  <!-- Checklist -->
  <g transform="translate(2040, 1750)" filter="url(#shadow)">
    <rect x="0" y="0" width="650" height="420" rx="12" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="2"/>
    <text x="28" y="38" fill="#1A202C" font-size="24" font-weight="bold">Lab 3 Verification Checklist</text>
    <text x="28" y="85" fill="#2F855A" font-size="19">[x] 5 Components (UI, Order, Payment, Printer, DB)</text>
    <text x="28" y="131" fill="#2F855A" font-size="19">[x] 4 Key Interfaces (IOrderProcessing, IPaymentService, etc.)</text>
    <text x="28" y="177" fill="#2F855A" font-size="19">[x] Proper UML Ball-and-Socket Notation Employed</text>
    <text x="28" y="223" fill="#2F855A" font-size="19">[x] &lt;&lt;component&gt;&gt; Stereotype &amp; UML 2.0 Icons Used</text>
    <text x="28" y="269" fill="#2F855A" font-size="19">[x] Protocol &amp; Data Flow Interactions Labeled</text>
    <text x="28" y="315" fill="#2F855A" font-size="19">[x] Credit Card PCI-DSS Isolated to Business Layer</text>
    <text x="28" y="361" fill="#2F855A" font-size="19">[x] Hardware Drivers Encapsulated from UI Layer</text>
  </g>
</svg>
