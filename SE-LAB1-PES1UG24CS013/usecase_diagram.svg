<svg viewBox="0 0 1300 970" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrowOpen" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10" fill="none" stroke="#333333" stroke-width="1.5"/>
    </marker>
    <marker id="arrowAssoc" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1300" height="970" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="650" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">Patient Health Record Consent Management System</text>
  <text x="650" y="56" text-anchor="middle" font-size="14" fill="#595959">UML Use-Case Diagram</text>

  <!-- System boundary -->
  <rect x="290" y="80" width="760" height="740" rx="6" fill="#F7F9FC" stroke="#1F3864" stroke-width="2"/>
  <text x="670" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">Patient Health Record Consent Management System</text>

  <!-- ===================== ACTORS ===================== -->
  <!-- Patient actor (left) -->
  <g id="actor-patient">
    <circle cx="90" cy="150" r="16" fill="none" stroke="#333333" stroke-width="2"/>
    <line x1="90" y1="166" x2="90" y2="215" stroke="#333333" stroke-width="2"/>
    <line x1="55" y1="185" x2="125" y2="185" stroke="#333333" stroke-width="2"/>
    <line x1="90" y1="215" x2="60" y2="255" stroke="#333333" stroke-width="2"/>
    <line x1="90" y1="215" x2="120" y2="255" stroke="#333333" stroke-width="2"/>
    <text x="90" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F1F1F">Patient</text>
  </g>

  <!-- Clinic Administrator actor (left, lower) -->
  <g id="actor-clinicadmin">
    <circle cx="90" cy="560" r="16" fill="none" stroke="#333333" stroke-width="2"/>
    <line x1="90" y1="576" x2="90" y2="625" stroke="#333333" stroke-width="2"/>
    <line x1="55" y1="595" x2="125" y2="595" stroke="#333333" stroke-width="2"/>
    <line x1="90" y1="625" x2="60" y2="665" stroke="#333333" stroke-width="2"/>
    <line x1="90" y1="625" x2="120" y2="665" stroke="#333333" stroke-width="2"/>
    <text x="90" y="685" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F1F1F">Clinic</text>
    <text x="90" y="702" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F1F1F">Administrator</text>
  </g>

  <!-- Verified Provider Registry actor (right, secondary/system actor) -->
  <g id="actor-registry">
    <circle cx="1220" cy="330" r="16" fill="none" stroke="#333333" stroke-width="2"/>
    <line x1="1220" y1="346" x2="1220" y2="395" stroke="#333333" stroke-width="2"/>
    <line x1="1185" y1="365" x2="1255" y2="365" stroke="#333333" stroke-width="2"/>
    <line x1="1220" y1="395" x2="1190" y2="435" stroke="#333333" stroke-width="2"/>
    <line x1="1220" y1="395" x2="1250" y2="435" stroke="#333333" stroke-width="2"/>
    <text x="1220" y="455" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F1F1F">Verified Provider</text>
    <text x="1220" y="470" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F1F1F">Registry</text>
    <text x="1220" y="485" text-anchor="middle" font-size="10.5" fill="#777777" font-style="italic">(system)</text>
  </g>

  <!-- Notification Service actor (right, secondary/system actor) -->
  <g id="actor-notify">
    <circle cx="1220" cy="620" r="16" fill="none" stroke="#333333" stroke-width="2"/>
    <line x1="1220" y1="636" x2="1220" y2="685" stroke="#333333" stroke-width="2"/>
    <line x1="1185" y1="655" x2="1255" y2="655" stroke="#333333" stroke-width="2"/>
    <line x1="1220" y1="685" x2="1190" y2="725" stroke="#333333" stroke-width="2"/>
    <line x1="1220" y1="685" x2="1250" y2="725" stroke="#333333" stroke-width="2"/>
    <text x="1220" y="745" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F1F1F">Notification</text>
    <text x="1220" y="760" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F1F1F">Service</text>
    <text x="1220" y="775" text-anchor="middle" font-size="10.5" fill="#777777" font-style="italic">(system)</text>
  </g>

  <!-- ===================== USE CASE OVALS ===================== -->
  <!-- UC1: Grant Time-Bound Consent -->
  <ellipse cx="500" cy="160" rx="140" ry="42" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.8"/>
  <text x="500" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1F1F">Grant Time-Bound</text>
  <text x="500" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1F1F">Consent (FR-001)</text>

  <!-- UC2: Revoke Consent -->
  <ellipse cx="500" cy="270" rx="140" ry="42" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.8"/>
  <text x="500" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1F1F">Revoke Consent (FR-002)</text>

  <!-- UC3: Request Patient Record Access (Clinic Admin) -->
  <ellipse cx="500" cy="560" rx="150" ry="46" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.8"/>
  <text x="500" y="555" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1F1F">Request Patient Record</text>
  <text x="500" y="572" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1F1F">Access (FR-003)</text>

  <!-- UC4: Verify Provider Identity (shared/included) -->
  <ellipse cx="850" cy="330" rx="150" ry="42" fill="#FDF3D9" stroke="#B8860B" stroke-width="1.8"/>
  <text x="850" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1F1F">Verify Provider Identity</text>
  <text x="850" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1F1F">(FR-004)</text>

  <!-- UC5: Send Notification (extend target) -->
  <ellipse cx="850" cy="620" rx="150" ry="42" fill="#FDF3D9" stroke="#B8860B" stroke-width="1.8"/>
  <text x="850" y="615" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1F1F">Send Access-Request /</text>
  <text x="850" y="632" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1F1F">Expiry Notification (FR-005)</text>

  <!-- UC6: Record Audit Log Entry (shared/included, bottom) -->
  <ellipse cx="670" cy="750" rx="160" ry="42" fill="#E2EFDA" stroke="#375623" stroke-width="1.8"/>
  <text x="670" y="745" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1F1F">Record Audit Trail Entry</text>
  <text x="670" y="762" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1F1F">(NFR-001)</text>

  <!-- ===================== ACTOR-TO-USECASE ASSOCIATIONS ===================== -->
  <!-- Patient -> Grant -->
  <line x1="106" y1="150" x2="358" y2="158" stroke="#333333" stroke-width="1.5"/>
  <!-- Patient -> Revoke -->
  <line x1="106" y1="160" x2="360" y2="255" stroke="#333333" stroke-width="1.5"/>

  <!-- Clinic Administrator -> Request Access -->
  <line x1="106" y1="560" x2="348" y2="560" stroke="#333333" stroke-width="1.5"/>

  <!-- Verified Provider Registry -> Verify Provider Identity -->
  <line x1="1204" y1="330" x2="1002" y2="330" stroke="#333333" stroke-width="1.5"/>

  <!-- Notification Service -> Send Notification -->
  <line x1="1204" y1="600" x2="1002" y2="611" stroke="#333333" stroke-width="1.5"/>

  <!-- ===================== INCLUDE / EXTEND RELATIONSHIPS ===================== -->
  <!-- <<include>>: Grant Time-Bound Consent includes Verify Provider Identity -->
  <line x1="622" y1="185" x2="736" y2="308" stroke="#1F3864" stroke-width="1.6" stroke-dasharray="7,4" marker-end="url(#arrowOpen)"/>
  <text x="700" y="235" text-anchor="middle" font-size="12" font-style="italic" fill="#1F3864" transform="rotate(38 700 235)">&#171;include&#187;</text>

  <!-- <<include>>: Request Patient Record Access includes Verify Provider Identity -->
  <line x1="640" y1="530" x2="740" y2="365" stroke="#1F3864" stroke-width="1.6" stroke-dasharray="7,4" marker-end="url(#arrowOpen)"/>
  <text x="735" y="450" text-anchor="middle" font-size="12" font-style="italic" fill="#1F3864" transform="rotate(-58 735 450)">&#171;include&#187;</text>

  <!-- <<include>>: Grant Time-Bound Consent includes Record Audit Trail Entry -->
  <path d="M 520 202 C 540 390, 590 630, 590 708" fill="none" stroke="#375623" stroke-width="1.6" stroke-dasharray="7,4" marker-end="url(#arrowOpen)"/>
  <text x="533" y="470" text-anchor="middle" font-size="12" font-style="italic" fill="#375623">&#171;include&#187;</text>

  <!-- <<include>>: Revoke Consent includes Record Audit Trail Entry -->
  <path d="M 540 308 C 610 460, 650 630, 655 708" fill="none" stroke="#375623" stroke-width="1.6" stroke-dasharray="7,4" marker-end="url(#arrowOpen)"/>
  <text x="640" y="490" text-anchor="middle" font-size="12" font-style="italic" fill="#375623">&#171;include&#187;</text>

  <!-- <<include>>: Request Patient Record Access includes Record Audit Trail Entry -->
  <path d="M 560 600 C 590 645, 610 680, 620 708" fill="none" stroke="#375623" stroke-width="1.6" stroke-dasharray="7,4" marker-end="url(#arrowOpen)"/>
  <text x="617" y="655" text-anchor="middle" font-size="12" font-style="italic" fill="#375623">&#171;include&#187;</text>

  <!-- <<extend>>: Send Notification extends Grant Time-Bound Consent (near-expiry reminder) -->
  <path d="M 780 588 C 700 400, 640 250, 640 190" fill="none" stroke="#8B4513" stroke-width="1.6" stroke-dasharray="3,4" marker-end="url(#arrowOpen)"/>
  <text x="770" y="380" text-anchor="middle" font-size="12" font-style="italic" fill="#8B4513" transform="rotate(-72 770 380)">&#171;extend&#187;</text>
  <text x="880" y="500" text-anchor="middle" font-size="10.5" fill="#8B4513" font-style="italic">[expiry &lt; 1 hr away]</text>

  <!-- <<extend>>: Send Notification extends Request Patient Record Access (new request alert) -->
  <line x1="700" y1="590" x2="650" y2="565" stroke="#8B4513" stroke-width="1.6" stroke-dasharray="3,4" marker-end="url(#arrowOpen)"/>
  <text x="695" y="565" text-anchor="middle" font-size="12" font-style="italic" fill="#8B4513">&#171;extend&#187;</text>
  <text x="695" y="605" text-anchor="middle" font-size="10.5" fill="#8B4513" font-style="italic">[on new request]</text>

  <!-- ===================== LEGEND ===================== -->
  <g id="legend">
    <rect x="20" y="862" width="1260" height="95" rx="4" fill="#FBFBFB" stroke="#CCCCCC" stroke-width="1"/>
    <text x="35" y="882" font-size="12" font-weight="bold" fill="#1F1F1F">Legend:</text>

    <line x1="35" y1="900" x2="70" y2="900" stroke="#333333" stroke-width="1.5"/>
    <text x="78" y="904" font-size="11.5" fill="#1F1F1F">Association</text>

    <line x1="180" y1="900" x2="215" y2="900" stroke="#1F3864" stroke-width="1.6" stroke-dasharray="7,4" marker-end="url(#arrowOpen)"/>
    <text x="223" y="904" font-size="11.5" fill="#1F1F1F">&#171;include&#187; (mandatory sub-behavior)</text>

    <line x1="460" y1="900" x2="495" y2="900" stroke="#8B4513" stroke-width="1.6" stroke-dasharray="3,4" marker-end="url(#arrowOpen)"/>
    <text x="503" y="904" font-size="11.5" fill="#1F1F1F">&#171;extend&#187; (optional/conditional behavior)</text>

    <ellipse cx="820" cy="900" rx="18" ry="11" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.5"/>
    <text x="845" y="904" font-size="11.5" fill="#1F1F1F">Primary use case</text>

    <ellipse cx="1000" cy="900" rx="18" ry="11" fill="#FDF3D9" stroke="#B8860B" stroke-width="1.5"/>
    <text x="1025" y="904" font-size="11.5" fill="#1F1F1F">Included/shared use case</text>

    <ellipse cx="35" cy="932" rx="18" ry="11" fill="#E2EFDA" stroke="#375623" stroke-width="1.5"/>
    <text x="60" y="936" font-size="11.5" fill="#1F1F1F">Audit/logging use case</text>
  </g>
</svg>
